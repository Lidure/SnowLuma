name: WS Client Routing Test

on:
  push:
    branches:
      - feat/ws-client-routing-active-final

jobs:
  onebot-routing-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @snowluma/onebot test -- ws-client-routing.test.ts
