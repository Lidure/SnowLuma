name: Dev Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

jobs:
  patch-routing-config:
    if: github.ref == 'refs/heads/feat/ws-client-routing-active-final'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ws-client-routing-active-final
      - name: Patch routing config integration points
        shell: python
        run: |
          from pathlib import Path
          p = Path('packages/onebot/src/config.ts')
          s = p.read_text()
          if "from './routing-config'" in s:
              raise SystemExit(0)
          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('missing patch anchor:\n' + old)
              s = s.replace(old, new, 1)
          rep("} from './types';\n", "} from './types';\nimport {\n  ROUTING_WS_CLIENT_KEYS,\n  parseGroupMessageFilter,\n  parseKeywordFilter,\n  parseMessagePrefix,\n  parsePrivateMessageFilter,\n  routingConfigToJson,\n  validateWsClientRouting,\n} from './routing-config';\n")
          rep(": ['url', 'role', 'reconnectIntervalMs'];", ": ['url', 'role', 'reconnectIntervalMs', ...ROUTING_WS_CLIENT_KEYS];")
          old = """    if (kind === 'wsClients' && raw.reconnectIntervalMs !== undefined) {
      const interval = parseRestoreInteger(raw.reconnectIntervalMs);
      if (interval === null || interval < 1000 || interval > NODE_TIMER_MAX_MS) {
        invalid(`${pathAt}.reconnectIntervalMs must be an integer between 1000 and ${NODE_TIMER_MAX_MS}`);
      }
    }
"""
          rep(old, old + """    if (kind === 'wsClients') {
      const routingError = validateWsClientRouting(raw, pathAt);
      if (routingError) invalid(routingError);
    }
""")
          old = """    if (
      item.reconnectIntervalMs !== undefined &&
      (
        typeof item.reconnectIntervalMs !== 'number' ||
        !Number.isSafeInteger(item.reconnectIntervalMs) ||
        item.reconnectIntervalMs < 1000 ||
        item.reconnectIntervalMs > NODE_TIMER_MAX_MS
      )
    ) {
      invalid(`${at}.reconnectIntervalMs must be an integer between 1000 and ${NODE_TIMER_MAX_MS}`);
    }
"""
          rep(old, old + """    const routingError = validateWsClientRouting(item, at);
    if (routingError) invalid(routingError);
""")
          rep("""      ? Math.max(1000, Math.trunc(n.reconnectIntervalMs))
      : 5000;
  return out;
}
""", """      ? Math.max(1000, Math.trunc(n.reconnectIntervalMs))
      : 5000;
  Object.assign(out, routingConfigToJson(n));
  return out;
}
""")
          rep("""    role: asRole(value.role, 'Universal'),
    reconnectIntervalMs: Math.max(1000, reconnectIntervalMs),
  });
}
""", """    role: asRole(value.role, 'Universal'),
    reconnectIntervalMs: Math.max(1000, reconnectIntervalMs),
    groupMessageFilter: parseGroupMessageFilter(value.groupMessageFilter),
    privateMessageFilter: parsePrivateMessageFilter(value.privateMessageFilter),
    keywordFilter: parseKeywordFilter(value.keywordFilter),
    messagePrefix: parseMessagePrefix(value.messagePrefix),
  });
}
""")
          p.write_text(s)
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/onebot/src/config.ts
          git commit -m "feat(onebot): persist ws client routing config"
          git push origin HEAD:feat/ws-client-routing-active-final
