name: Dev Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

jobs:
  patch-node-editor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/ws-client-routing-active-final

      - name: Patch node editor
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/webui/src/components/config/node-edit-dialog.tsx')
          s = p.read_text()
          if "from './ws-client-routing-fields'" in s:
              raise SystemExit(0)

          old_import = "import { generateAccessToken, NETWORK_TABS } from './defaults';\n"
          new_import = old_import + "import { WsClientRoutingFields, type RoutingWsClientNetwork } from './ws-client-routing-fields';\n"
          if old_import not in s:
              raise SystemExit('missing import anchor')
          s = s.replace(old_import, new_import, 1)

          old_tail = """        </Section>
      </div>
    </Modal>
  );
}
"""
          new_tail = """        </Section>

        {kind === 'wsClients' && (
          <WsClientRoutingFields
            value={draft as RoutingWsClientNetwork}
            onChange={(changes) => patch(changes as unknown as Partial<AnyAdapter<K>>)}
          />
        )}
      </div>
    </Modal>
  );
}
"""
          if old_tail not in s:
              raise SystemExit('missing render tail anchor')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/webui/src/components/config/node-edit-dialog.tsx
          git commit -m "feat(webui): expose ws client routing controls"
          git push origin HEAD:feat/ws-client-routing-active-final
