name: Dev Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

jobs:
  routing-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run routing test
        run: pnpm --filter @snowluma/onebot test -- ws-client-routing.test.ts
