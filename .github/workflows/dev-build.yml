name: Dev Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

jobs:
  patch-routing-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/ws-client-routing-active-final

      - name: Patch routing config
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('packages/onebot/src/config.ts')
          s = p.read_text()
          if "from './routing-config'" in s:
              raise SystemExit(0)

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('missing patch anchor: ' + repr(old))
              s = s.replace(old, new, 1)

          def sub(pattern, replacement):
              global s
              s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('regex patch count=' + str(count) + ': ' + pattern)
              s = s2

          rep("} from './types';\n", "} from './types';\nimport {\n  ROUTING_WS_CLIENT_KEYS,\n  parseGroupMessageFilter,\n  parseKeywordFilter,\n  parseMessagePrefix,\n  parsePrivateMessageFilter,\n  routingConfigToJson,\n  validateWsClientRouting,\n} from './routing-config';\n")
          rep(": ['url', 'role', 'reconnectIntervalMs'];", ": ['url', 'role', 'reconnectIntervalMs', ...ROUTING_WS_CLIENT_KEYS];")

          sub(
              r"(if \(kind === 'wsClients' && raw\.reconnectIntervalMs !== undefined\) \{.*?invalid\(`\$\{pathAt\}\.reconnectIntervalMs must be an integer between 1000 and \$\{NODE_TIMER_MAX_MS\}`\);\s*\}\s*\})",
              r"\1\n    if (kind === 'wsClients') {\n      const routingError = validateWsClientRouting(raw, pathAt);\n      if (routingError) invalid(routingError);\n    }",
          )

          sub(
              r"(if \(\s*item\.reconnectIntervalMs !== undefined &&.*?invalid\(`\$\{at\}\.reconnectIntervalMs must be an integer between 1000 and \$\{NODE_TIMER_MAX_MS\}`\);\s*\})",
              r"\1\n    const routingError = validateWsClientRouting(item, at);\n    if (routingError) invalid(routingError);",
          )

          rep(": 5000;\n  return out;\n}\n\nfunction fromJson", ": 5000;\n  Object.assign(out, routingConfigToJson(n));\n  return out;\n}\n\nfunction fromJson")
          rep("    reconnectIntervalMs: Math.max(1000, reconnectIntervalMs),\n  });\n}\n\nfunction hasLegacyTopLevel", "    reconnectIntervalMs: Math.max(1000, reconnectIntervalMs),\n    groupMessageFilter: parseGroupMessageFilter(value.groupMessageFilter),\n    privateMessageFilter: parsePrivateMessageFilter(value.privateMessageFilter),\n    keywordFilter: parseKeywordFilter(value.keywordFilter),\n    messagePrefix: parseMessagePrefix(value.messagePrefix),\n  });\n}\n\nfunction hasLegacyTopLevel")

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/onebot/src/config.ts
          git commit -m "feat(onebot): persist ws client routing config"
          git push origin HEAD:feat/ws-client-routing-active-final
