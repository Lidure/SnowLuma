name: Private Feature Test

on:
  push:
    branches:
      - feat/ws-client-scoped-keywords-prefix-test-harness

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Apply one-shot config patch
        run: grep -q "MESSAGE_PREFIX_KEYS" packages/onebot/src/config.ts || python tools/apply-scoped-routing-config.py
      - name: Apply one-shot WebUI patch
        run: grep -q "keywordScopeEnabled" packages/webui/src/components/config/node-edit-dialog.tsx || python tools/apply-scoped-routing-webui.py
      - run: pnpm test
      - run: pnpm typecheck
      - name: Commit generated feature files
        if: success()
        run: |
          git add packages/onebot/src/config.ts packages/webui/src/components/config/node-edit-dialog.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: materialize scoped ws client routing"
          git pull --rebase origin feat/ws-client-scoped-keywords-prefix-test-harness
          git push
